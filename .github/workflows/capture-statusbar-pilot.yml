name: Capture iPhone 17 Pro status bar pilot

on:
  workflow_dispatch:

jobs:
  capture:
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Check out calibration package
        uses: actions/checkout@v4

      - name: Select Xcode and inspect simulator inventory
        shell: bash
        run: |
          set -euo pipefail
          if [[ -d /Applications/Xcode_26.4.1.app ]]; then
            sudo xcode-select -s /Applications/Xcode_26.4.1.app/Contents/Developer
          fi
          mkdir -p artifacts
          xcodebuild -version | tee artifacts/xcode-version.txt
          xcrun simctl list runtimes | tee artifacts/simulator-runtimes.txt
          xcrun simctl list devices available | tee artifacts/simulator-devices.txt
          xcrun simctl help status_bar > artifacts/status-bar-help.txt 2>&1

      - name: Capture three calibration samples
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/capture-pilot.sh

      - name: Upload calibration samples
        uses: actions/upload-artifact@v4
        with:
          name: iphone-17-pro-statusbar-pilot
          path: artifacts/
          if-no-files-found: error
          retention-days: 7
